<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feelme - Cerita di sini, temukan maknanya</title>
    <!-- Tailwind CSS untuk styling modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelBlue: '#E2ECF8',
                        pastelYellow: '#FEF3C7',
                        navyText: '#2C3E50',
                        softYellowBtn: '#FDE68A'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #F4F8FC;
            color: #2C3E50;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="w-full py-6 px-8 md:px-16 flex items-center justify-between z-10">
        <!-- Logo -->
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-bold tracking-wide text-blue-900 bg-pastelYellow px-4 py-1.5 rounded-full shadow-sm">
                ✨ feelme
            </span>
        </div>

        <!-- Navigation Menu -->
        <nav class="hidden md:flex items-center space-x-8 bg-white/70 backdrop-blur-md px-6 py-2 rounded-full shadow-sm border border-blue-100">
            <a href="#" class="flex items-center space-x-1 font-semibold text-blue-900 bg-amber-200/60 px-4 py-1.5 rounded-full shadow-xs">
                <span>🏠</span><span>Beranda</span>
            </a>
            <a href="#" class="flex items-center space-x-1 font-medium text-gray-600 hover:text-blue-900 transition">
                <span>💬</span><span>Tentang</span>
            </a>
            <a href="#" class="flex items-center space-x-1 font-medium text-gray-600 hover:text-blue-900 transition">
                <span>🛡️</span><span>Privasi</span>
            </a>
            <a href="#" class="flex items-center space-x-1 font-medium text-gray-600 hover:text-blue-900 transition">
                <span>🤍</span><span>Motivasi</span>
            </a>
        </nav>

        <!-- Dark Mode Toggle (Visual) -->
        <div class="bg-white/70 p-2.5 rounded-full shadow-sm border border-blue-100 cursor-pointer hover:bg-white transition">
            🌙
        </div>
    </header>

    <!-- Main Content Hero Section -->
    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 md:px-8 relative z-10 -mt-10">
        
        <!-- Main Title -->
        <div class="relative max-w-2xl mx-auto">
            <h1 class="text-5xl md:text-6xl font-extrabold text-blue-900 tracking-tight mb-4">
                feelme
            </h1>
            <div class="inline-block bg-amber-200/80 text-blue-900 font-semibold px-6 py-2 rounded-full shadow-xs text-sm md:text-base mb-6 transform -rotate-1">
                Cerita di sini, temukan maknanya. 🤍
            </div>
        </div>

        <!-- Subtitle -->
        <p class="text-gray-600 text-sm md:text-base max-w-md mx-auto mb-8 font-medium">
            Curhat apa pun yang kamu rasakan, dan temukan pengingat dari Al-Qur'an dan hadis.
        </p>

        <!-- Input Box Curhat -->
        <div class="w-full max-w-xl bg-white rounded-full shadow-lg border border-blue-100 p-2 flex items-center mb-6 transition-all focus-within:ring-2 focus-within:ring-amber-300">
            <div class="pl-4 text-gray-400 text-xl">
                💬
            </div>
            <input type="text" placeholder="Aku sedang merasa ..." 
                   class="w-full px-4 py-3 bg-transparent focus:outline-none text-gray-700 placeholder-gray-400 text-sm md:text-base">
            <button class="bg-amber-300 hover:bg-amber-400 text-blue-900 p-3 rounded-full transition shadow-sm flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>

        <!-- Privacy Badge -->
        <div class="inline-flex items-center space-x-2 bg-white/80 border border-blue-100 px-4 py-1.5 rounded-full text-xs text-gray-500 shadow-xs">
            <span>🔒</span>
            <span>Privasi kamu aman bersama kami</span>
            <span class="text-rose-400">🤍</span>
        </div>

    </main>

    <!-- Footer / Background Illustrations Elements -->
    <div class="absolute bottom-0 left-0 right-0 pointer-events-none flex justify-between items-end overflow-hidden opacity-80 z-0">
        <div class="hidden lg:block p-6">
            <div class="text-4xl">📚🐱💤</div>
        </div>
        <div class="hidden lg:block p-6">
            <div class="text-4xl">🕌🌙🌷</div>
        </div>
    </div>

</body>
</html>
